<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#7057D9">
  <meta name="description" content="Emotion Hero — game edukasi anak untuk mengenali emosi, belajar menenangkan diri, dan berempati.">
  <title>Emotion Hero — Genius Kids</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./assets/icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="./assets/icons/icon-192.png">
  <link rel="stylesheet" href="./css/tokens.css">
  <link rel="stylesheet" href="./css/base.css">
  <link rel="stylesheet" href="./css/layout.css">
  <link rel="stylesheet" href="./css/components.css">
  <link rel="stylesheet" href="./css/dashboard.css">
  <link rel="stylesheet" href="./css/gameplay.css">
  <link rel="stylesheet" href="./css/animations.css">
  <link rel="stylesheet" href="./css/responsive.css">
</head>
<body>
  <div class="app-shell">
    <header class="topbar" id="topbar">
      <a class="brand" href="#" data-action="home" aria-label="Emotion Hero beranda">
        <span class="brand-mark">★</span>
        <span>Emotion <b>Hero</b></span>
      </a>
      <div class="topbar-actions">
        <div class="star-pill" aria-label="Total bintang">
          <span>⭐</span><strong id="top-stars">0</strong>
        </div>
        <button class="icon-button" type="button" data-action="settings" aria-label="Pengaturan">⚙</button>
      </div>
    </header>
    <main id="app" class="main-content" tabindex="-1">
      <div class="loading-card">
        <div class="loading-mascot">🦸</div>
        <h1>Emotion Hero</h1>
        <p>Menyiapkan petualanganmu...</p>
      </div>
    </main>
    <footer class="app-footer">
      <span>Genius Kids Series 2</span>
      <span>Belajar sambil bermain 💜</span>
    </footer>
  </div>
  <div id="toast-region" class="toast-region" aria-live="polite" aria-atomic="true"></div>
  <script type="module" src="./js/app.js"></script>
</body>
</html>
